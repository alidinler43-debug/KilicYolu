name: APK oluştur

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-project.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projeyi aç
        run: unzip -o android-project.zip -d build-src

      - name: Three.js kütüphanesini indir
        run: curl -fL -o build-src/app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js

      - name: APK derle
        working-directory: build-src
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: APK dosyasını adlandır
        run: cp build-src/app/build/outputs/apk/release/app-release.apk KilicYolu-${{ github.run_number }}.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kılıç Yolu ${{ github.run_number }}
          files: KilicYolu-${{ github.run_number }}.apk
